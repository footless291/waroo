    <style>
      /* Splash: only in the installed app, where it continues the launch image. */
      #splash { display: none; }
      .standalone #splash {
        position: fixed; inset: 0; z-index: 100;
        display: grid; place-items: center;
        background: #fff5ee;
        transition: opacity 220ms ease;
      }
      @media (prefers-color-scheme: dark) { .standalone #splash { background: #16121f; } }
      html[data-theme='light'].standalone #splash { background: #fff5ee; }
      html[data-theme='dark'].standalone #splash { background: #16121f; }
      #splash.gone { opacity: 0; pointer-events: none; }
    </style>
